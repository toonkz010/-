<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>สร้างป้ายราคาสินค้า</title>
<meta name="theme-color" content="#20231f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ป้ายราคา">
<link id="manifestLink" rel="manifest" href="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2320231f'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%8F%B7%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800;900&family=Kanit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20231f;
    --paper:#f6f4ee;
    --card:#ffffff;
    --line:#e2ddd0;
    --accent:#c1391f;
    --muted:#8a8474;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; height:100%; overscroll-behavior-y:none;}
  body{
    background:var(--paper);
    font-family:'Noto Sans Thai', sans-serif;
    color:var(--ink);
    display:flex; flex-direction:column;
    min-height:100dvh;
  }
  input, select, button, textarea{font-family:inherit;}
  input, select{font-size:16px;} /* prevent iOS auto-zoom */

  /* ---------- App bar ---------- */
  .appbar{
    background:var(--ink); color:#fff;
    padding:calc(12px + var(--safe-t)) 16px 12px;
    display:flex; align-items:center; gap:10px;
    position:sticky; top:0; z-index:30;
  }
  .appbar .title{
    font-family:'Kanit',sans-serif; font-weight:700; font-size:17px; flex:1;
  }
  .iconbtn{
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18);
    color:#fff; width:38px; height:38px; border-radius:10px;
    font-size:17px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex; gap:6px; padding:10px 16px 0;
    background:var(--paper);
    position:sticky; top:calc(58px + var(--safe-t)); z-index:25;
  }
  .tabbtn{
    flex:1; padding:11px 8px; border:none; border-radius:11px 11px 0 0;
    background:transparent; color:var(--muted);
    font-family:'Kanit',sans-serif; font-weight:600; font-size:14.5px;
    cursor:pointer; border-bottom:3px solid transparent;
  }
  .tabbtn.active{ color:var(--ink); border-bottom:3px solid var(--accent); }

  main{ flex:1; width:100%; max-width:560px; margin:0 auto; padding:0 0 90px; }
  .tabpanel{ display:none; padding:14px 16px; }
  .tabpanel.active{ display:block; }

  /* ---------- Cards / form ---------- */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:12px;
  }
  .card h2{
    font-family:'Kanit',sans-serif; font-size:13px; margin:0 0 10px;
    color:var(--muted); text-transform:uppercase; letter-spacing:.4px;
  }
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px;}
  .field input{
    width:100%; padding:11px 12px; border:1px solid var(--line);
    border-radius:10px; background:#fdfcfa;
  }
  .row2{display:flex; gap:8px;}
  .row2 .field{flex:1;}
  .qtyrow{display:flex; align-items:center; gap:10px;}
  .stepper{
    display:flex; align-items:center; gap:0; border:1px solid var(--line);
    border-radius:10px; overflow:hidden; background:#fdfcfa;
  }
  .stepper button{
    width:42px; height:42px; border:none; background:#efece2; color:var(--ink);
    font-size:19px; font-weight:700; cursor:pointer;
  }
  .stepper input{
    width:50px; text-align:center; border:none; background:transparent;
    padding:0; height:42px; -moz-appearance:textfield;
  }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

  .bigbtn{
    width:100%; padding:14px; border:none; border-radius:12px; cursor:pointer;
    font-family:'Kanit',sans-serif; font-weight:700; font-size:15.5px;
    background:var(--ink); color:#fff;
  }
  .bigbtn:active{ opacity:.85; }

  /* ---------- Item list ---------- */
  .itemcard{
    background:var(--card); border:1px solid var(--line); border-radius:13px;
    padding:12px; margin-bottom:10px;
    display:flex; flex-direction:column; gap:8px;
  }
  .itemcard .head{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .itemcard .head input{
    border:none; background:transparent; font-weight:600; font-size:15px; padding:2px 0;
    flex:1; min-width:0;
  }
  .itemcard .del{
    background:#f6eae6; color:var(--accent); border:none; width:32px; height:32px;
    border-radius:9px; font-size:15px; cursor:pointer; flex-shrink:0;
  }
  .itemcard .sub{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .itemcard .pricefield{
    display:flex; align-items:center; gap:5px; border:1px solid var(--line);
    border-radius:9px; padding:6px 10px; background:#fdfcfa;
  }
  .itemcard .pricefield input{
    border:none; background:transparent; width:64px; font-weight:700; color:var(--accent);
  }
  .itemcard .pricefield .u{ color:var(--muted); font-size:12.5px; }
  .itemcard .pricefield .u input{ width:44px; font-weight:500; color:var(--muted); }
  .itemcard .qty{ display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-left:auto; }
  .itemcard .qty button{ width:34px; height:34px; border:none; background:#efece2; font-size:16px; font-weight:700; cursor:pointer; }
  .itemcard .qty span{ width:34px; text-align:center; font-size:14px; font-weight:600; }

  .empty-list{ text-align:center; color:#b6b0a0; font-size:13px; padding:24px 10px; }

  .infobar{
    background:#fbf6ee; border:1px dashed #d9c9a8; border-radius:12px;
    padding:12px 13px; font-size:12.8px; line-height:1.7; color:#5a4c33; margin-top:4px;
  }
  .infobar b{ color:var(--ink); }

  /* ---------- Preview tab ---------- */
  .previewScroll{
    width:100%; overflow:auto; border-radius:12px; background:#e9e6dc;
    padding:12px; -webkit-overflow-scrolling:touch;
  }
  #scaleWrap{ transform-origin: top left; }
  #printArea{
    background:#fff; width:21cm; min-height:29.7cm;
    padding: var(--pgmargin,1cm);
    box-shadow:0 6px 22px rgba(0,0,0,.15);
    display:flex; flex-wrap:wrap; align-content:flex-start;
    gap: var(--gap,0.3cm);
  }
  .empty-hint{ width:100%; text-align:center; color:#b6b0a0; font-size:14px; padding:60px 16px; }

  .tag{
    width: var(--tw,7cm); height: var(--th,4cm);
    border:1.6px dashed #b9b3a2; border-radius:4px; background:#fff;
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:6px 8%; overflow:hidden; break-inside:avoid; page-break-inside:avoid;
  }
  .tag .name{ font-weight:600; color:#3a362c; white-space:nowrap; line-height:1.15; text-align:center; max-width:100%; }
  .tag .pricewrap{ display:flex; align-items:baseline; justify-content:center; gap:.12em; white-space:nowrap; max-width:100%; }
  .tag .price{ font-family:'Kanit',sans-serif; font-weight:800; color:var(--accent); line-height:1; }
  .tag .unit{ font-weight:600; color:var(--accent); opacity:.85; }
  .tag .corner{ position:absolute; top:5%; left:5%; width:10%; aspect-ratio:1; border-left:1.6px solid #cfa15a; border-top:1.6px solid #cfa15a; opacity:.5; }

  /* ---------- Bottom bar ---------- */
  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:linear-gradient(to top, var(--paper) 65%, rgba(246,244,238,0));
    padding:14px 16px calc(14px + var(--safe-b));
    display:flex; justify-content:center;
  }
  .printfab{
    width:100%; max-width:528px; padding:15px; border:none; border-radius:14px;
    background:var(--accent); color:#fff; font-family:'Kanit',sans-serif; font-weight:700;
    font-size:16px; cursor:pointer; box-shadow:0 6px 18px rgba(193,57,31,.35);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .printfab:active{ transform:scale(.98); }

  /* ---------- Modal ---------- */
  .modal{
    position:fixed; inset:0; background:rgba(20,18,14,.5); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal.hidden{ display:none; }
  .modalcard{
    background:#fff; width:100%; max-width:560px; border-radius:18px 18px 0 0;
    padding:18px 18px calc(18px + var(--safe-b)); max-height:85vh; overflow:auto;
  }
  .modalcard h3{ font-family:'Kanit',sans-serif; margin:0 0 14px; font-size:16px; }
  .modalcard .closebar{ display:flex; justify-content:flex-end; margin-bottom:-6px; }
  .modalcard .closebar button{ background:none; border:none; font-size:14px; color:var(--muted); }
  .sizechips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chip{
    padding:9px 14px; border-radius:999px; border:1px solid var(--line); background:#fdfcfa;
    font-size:13.5px; cursor:pointer;
  }
  .chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .instalhint{ font-size:12px; color:var(--muted); line-height:1.6; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }

  @media (min-width:640px){
    .appbar, .tabs{ padding-left:calc((100% - 560px)/2 + 16px); padding-right:calc((100% - 560px)/2 + 16px); }
  }

  @media print{
    body{background:#fff; display:block; min-height:0;}
    .appbar, .tabs, .bottombar, .modal{ display:none !important; }
    main{ max-width:none; padding:0; }
    .tabpanel{ display:none !important; padding:0; }
    #tab-preview{ display:block !important; }
    .previewScroll{ overflow:visible !important; background:none !important; padding:0 !important; border-radius:0; }
    #scaleWrap{ transform:none !important; width:auto !important; }
    #printArea{ box-shadow:none !important; width:auto !important; min-height:0 !important; margin:0 !important; padding:0 !important; }
    @page{ size:A4; margin: var(--pgmargin,1cm); }
  }
</style>
</head>
<body>

<div class="appbar">
  <div class="title">🏷️ ป้ายราคาสินค้า</div>
  <button class="iconbtn" id="settingsBtn">⚙️</button>
</div>

<div class="tabs">
  <button class="tabbtn active" data-tab="edit">รายการป้าย</button>
  <button class="tabbtn" data-tab="preview">ตัวอย่างพิมพ์</button>
</div>

<main>
  <section id="tab-edit" class="tabpanel active">
    <div class="card">
      <h2>เพิ่มป้ายใหม่</h2>
      <div class="field">
        <label>ชื่อสินค้า</label>
        <input type="text" id="inName" placeholder="เช่น น้ำดื่มขนาด 600 มล.">
      </div>
      <div class="field">
        <label>ราคา / หน่วย</label>
        <div class="row2">
          <input type="text" id="inPrice" placeholder="ราคา เช่น 10" inputmode="decimal">
          <input type="text" id="inUnit" placeholder="หน่วย" value="บาท" style="max-width:100px;">
        </div>
      </div>
      <div class="field">
        <label>จำนวนป้าย</label>
        <div class="stepper" style="width:140px;">
          <button type="button" id="qMinus">−</button>
          <input type="number" id="inQty" value="1" min="1" max="500">
          <button type="button" id="qPlus">+</button>
        </div>
      </div>
      <button class="bigbtn" id="addBtn">+ เพิ่มลงหน้าพิมพ์</button>
    </div>

    <div id="defsList"></div>
    <div class="infobar" id="infoBox">กำลังคำนวณ…</div>
  </section>

  <section id="tab-preview" class="tabpanel">
    <div class="previewScroll">
      <div id="scaleWrap">
        <div id="printArea"></div>
      </div>
    </div>
  </section>
</main>

<div class="bottombar">
  <button class="printfab" id="printBtn">🖨 พิมพ์ / บันทึกเป็น PDF</button>
</div>

<div class="modal hidden" id="settingsModal">
  <div class="modalcard">
    <div class="closebar"><button id="closeSettings">ปิด ✕</button></div>
    <h3>ตั้งค่าขนาดป้าย</h3>
    <div class="sizechips" id="sizeChips">
      <button class="chip" data-w="7" data-h="4">7×4 ซม.</button>
      <button class="chip" data-w="7" data-h="5">7×5 ซม.</button>
      <button class="chip" data-w="8" data-h="5">8×5 ซม.</button>
      <button class="chip" data-w="5" data-h="3">5×3 ซม.</button>
      <button class="chip" data-w="10" data-h="7">10×7 ซม.</button>
    </div>
    <div class="row2">
      <div class="field"><label>กว้าง (ซม.)</label><input type="number" id="customW" min="2" max="20" step="0.5"></div>
      <div class="field"><label>สูง (ซม.)</label><input type="number" id="customH" min="2" max="20" step="0.5"></div>
    </div>
    <div class="row2">
      <div class="field"><label>ระยะขอบกระดาษ (ซม.)</label><input type="number" id="pgMargin" min="0" max="3" step="0.1"></div>
      <div class="field"><label>ระยะห่างป้าย (ซม.)</label><input type="number" id="gapSize" min="0" max="2" step="0.1"></div>
    </div>
    <button class="bigbtn" id="clearBtn" style="background:#f6eae6; color:var(--accent); margin-bottom:8px;">🗑 ล้างรายการทั้งหมด</button>
    <button class="bigbtn" id="doneSettings">เสร็จสิ้น</button>
    <div class="instalhint">
      💡 ติดตั้งเป็นแอปบนมือถือ: Android กด ⋮ เลือก "เพิ่มลงหน้าจอหลัก" · iPhone กดปุ่มแชร์ 📤 แล้วเลือก "เพิ่มไปยังหน้าจอโฮม"
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'priceTagMaker_v2';

let state = { w:7, h:4, pgMargin:1, gap:0.3, defs:[] };

function load(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw) state = Object.assign(state, JSON.parse(raw)); }catch(e){}
}
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function uid(){ return 'id'+Math.random().toString(36).slice(2,9); }
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

/* ---------- Tabs ---------- */
document.querySelectorAll('.tabbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tabpanel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='preview') requestAnimationFrame(updatePreviewScale);
  });
});

/* ---------- Settings modal ---------- */
const settingsModal = document.getElementById('settingsModal');
document.getElementById('settingsBtn').addEventListener('click', ()=>{ settingsModal.classList.remove('hidden'); syncSettingsUI(); });
document.getElementById('closeSettings').addEventListener('click', ()=> settingsModal.classList.add('hidden'));
document.getElementById('doneSettings').addEventListener('click', ()=> settingsModal.classList.add('hidden'));

const customW = document.getElementById('customW');
const customH = document.getElementById('customH');
const pgMarginInput = document.getElementById('pgMargin');
const gapInput = document.getElementById('gapSize');

function syncSettingsUI(){
  customW.value = state.w; customH.value = state.h;
  pgMarginInput.value = state.pgMargin; gapInput.value = state.gap;
  document.querySelectorAll('.chip').forEach(c=>{
    c.classList.toggle('active', parseFloat(c.dataset.w)===state.w && parseFloat(c.dataset.h)===state.h);
  });
}
document.getElementById('sizeChips').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip'); if(!chip) return;
  state.w = parseFloat(chip.dataset.w); state.h = parseFloat(chip.dataset.h);
  syncSettingsUI(); renderAll();
});
customW.addEventListener('input', ()=>{ state.w = parseFloat(customW.value)||7; syncSettingsUI(); renderAll(); });
customH.addEventListener('input', ()=>{ state.h = parseFloat(customH.value)||4; syncSettingsUI(); renderAll(); });
pgMarginInput.addEventListener('input', ()=>{ state.pgMargin = parseFloat(pgMarginInput.value)||0; renderAll(); });
gapInput.addEventListener('input', ()=>{ state.gap = parseFloat(gapInput.value)||0; renderAll(); });

document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(confirm('ล้างรายการป้ายทั้งหมด?')){ state.defs=[]; settingsModal.classList.add('hidden'); renderAll(); }
});

/* ---------- Quick add ---------- */
const inQty = document.getElementById('inQty');
document.getElementById('qMinus').addEventListener('click', ()=>{ inQty.value = Math.max(1,(parseInt(inQty.value)||1)-1); });
document.getElementById('qPlus').addEventListener('click', ()=>{ inQty.value = Math.min(500,(parseInt(inQty.value)||1)+1); });

document.getElementById('addBtn').addEventListener('click', ()=>{
  const name = document.getElementById('inName').value.trim() || 'ชื่อสินค้า';
  const price = document.getElementById('inPrice').value.trim() || '0';
  const unit = document.getElementById('inUnit').value.trim() || 'บาท';
  const qty = Math.max(1, parseInt(inQty.value)||1);
  state.defs.push({id:uid(), name, price, unit, qty});
  document.getElementById('inName').value=''; document.getElementById('inPrice').value=''; inQty.value=1;
  renderAll();
});

document.getElementById('printBtn').addEventListener('click', ()=> window.print());

/* ---------- Render list ---------- */
const defsList = document.getElementById('defsList');
function renderDefsList(){
  if(state.defs.length===0){ defsList.innerHTML = '<p class="empty-list">ยังไม่มีป้าย — เพิ่มด้านบนได้เลย</p>'; return; }
  defsList.innerHTML='';
  state.defs.forEach(d=>{
    const card = document.createElement('div');
    card.className='itemcard';
    card.innerHTML = `
      <div class="head">
        <input type="text" data-field="name" data-id="${d.id}" value="${escapeAttr(d.name)}" placeholder="ชื่อสินค้า">
        <button class="del" data-id="${d.id}">✕</button>
      </div>
      <div class="sub">
        <div class="pricefield">
          <input type="text" data-field="price" data-id="${d.id}" value="${escapeAttr(d.price)}" style="width:56px;">
          <span class="u"><input type="text" data-field="unit" data-id="${d.id}" value="${escapeAttr(d.unit)}"></span>
        </div>
        <div class="qty">
          <button data-act="minus" data-id="${d.id}">−</button>
          <span>${d.qty}</span>
          <button data-act="plus" data-id="${d.id}">+</button>
        </div>
      </div>`;
    defsList.appendChild(card);
  });

  defsList.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const def = state.defs.find(x=>x.id===inp.dataset.id); if(!def) return;
      def[inp.dataset.field] = inp.value;
      renderPrintArea(); save();
    });
  });
  defsList.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.defs = state.defs.filter(x=>x.id!==btn.dataset.id); renderAll(); });
  });
  defsList.querySelectorAll('.qty button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const def = state.defs.find(x=>x.id===btn.dataset.id); if(!def) return;
      if(btn.dataset.act==='plus') def.qty = Math.min(500, def.qty+1);
      else def.qty = Math.max(1, def.qty-1);
      renderAll();
    });
  });
}

/* ---------- Render print area ---------- */
const printArea = document.getElementById('printArea');
const infoBox = document.getElementById('infoBox');

function autoFit(el, maxPx, minPx){
  let size = maxPx; el.style.fontSize = size+'px';
  let guard=0;
  while(guard++ < 60){
    if(el.scrollWidth <= el.clientWidth + 1 || size <= minPx) break;
    size -= 1; el.style.fontSize = size+'px';
  }
}
function fitAllTags(){
  document.querySelectorAll('.tag').forEach(tag=>{
    const nameEl = tag.querySelector('.name'), priceEl = tag.querySelector('.price'), unitEl = tag.querySelector('.unit');
    autoFit(nameEl, 30, 8); autoFit(priceEl, 96, 14);
    unitEl.style.fontSize = Math.max(10,(parseFloat(priceEl.style.fontSize)||24)*0.34)+'px';
  });
}

function renderPrintArea(){
  document.documentElement.style.setProperty('--pgmargin', state.pgMargin+'cm');
  document.documentElement.style.setProperty('--gap', state.gap+'cm');
  document.documentElement.style.setProperty('--tw', state.w+'cm');
  document.documentElement.style.setProperty('--th', state.h+'cm');

  printArea.innerHTML=''; let total=0;
  state.defs.forEach(d=>{
    total += d.qty;
    for(let i=0;i<d.qty;i++){
      const tag = document.createElement('div'); tag.className='tag';
      tag.innerHTML = `<div class="corner"></div>
        <div class="name">${escapeHtml(d.name)}</div>
        <div class="pricewrap"><div class="price">${escapeHtml(d.price)}</div><div class="unit">${escapeHtml(d.unit)}</div></div>`;
      printArea.appendChild(tag);
    }
  });
  if(total===0) printArea.innerHTML = '<div class="empty-hint">ยังไม่มีป้าย — ไปที่แท็บ "รายการป้าย" เพื่อเริ่มเพิ่ม</div>';

  requestAnimationFrame(()=>{ fitAllTags(); updatePreviewScale(); });
  updateInfo(total);
}

function updateInfo(total){
  const pageW = 21 - state.pgMargin*2, pageH = 29.7 - state.pgMargin*2;
  const cols = Math.max(1, Math.floor((pageW+state.gap)/(state.w+state.gap)));
  const rows = Math.max(1, Math.floor((pageH+state.gap)/(state.h+state.gap)));
  const perPage = cols*rows;
  const pages = total===0 ? 0 : Math.ceil(total/perPage);
  infoBox.innerHTML = `ป้ายทั้งหมด <b>${total}</b> ชิ้น · จุได้ <b>${perPage}</b> ชิ้น/หน้า A4 (${cols}×${rows})<br>ใช้กระดาษประมาณ <b>${pages}</b> แผ่น`;
}

/* ---------- Preview scaling for mobile ---------- */
function updatePreviewScale(){
  const scrollEl = document.querySelector('.previewScroll');
  const scaleWrap = document.getElementById('scaleWrap');
  if(!scrollEl || printArea.offsetWidth===0) return;
  const availW = scrollEl.clientWidth - 24;
  const naturalW = printArea.offsetWidth;
  const scale = Math.min(1, availW/naturalW);
  scaleWrap.style.transform = `scale(${scale})`;
  scrollEl.style.height = (printArea.offsetHeight*scale + 24) + 'px';
}
window.addEventListener('resize', ()=> requestAnimationFrame(()=>{ fitAllTags(); updatePreviewScale(); }));
window.addEventListener('beforeprint', fitAllTags);

};
document.getElementById('manifestLink').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/json'}));
